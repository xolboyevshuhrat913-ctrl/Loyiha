name: CI

# Faqat tekshiruv: fayllar joyidami, image yig'iladimi, sayt ochiladimi?
# Hech narsa yuklanmaydi va serverga tegilmaydi.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tekshiruv
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Havolalarni tekshirish (css, js, rasm bormi?)
        run: python3 .github/scripts/check_links.py

      - name: Docker image yig'ish
        run: docker build -t vektorops-landing:ci .

      - name: Konteynerni ishga tushirib sinash
        run: |
          docker run -d --name site -p 8001:8001 vektorops-landing:ci
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8001/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8001/
          curl -fsSI http://127.0.0.1:8001/css/base.css | grep -i "content-type: text/css"
          echo "Sayt ishlayapti"

      - name: Xato bo'lsa loglar
        if: failure()
        run: docker logs site || true
