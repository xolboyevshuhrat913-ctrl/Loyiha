name: CD

# CI main'da muvaffaqiyatli o'tgach:
#   1) image yig'ilib Docker Hub'ga yuklanadi
#   2) server Docker Hub'dan tortib, yangisini ishga tushiradi
# Qo'lda ham ishga tushirsa bo'ladi (Actions -> CD -> Run workflow).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ---------- 1) Docker Hub'ga yuklash ----------
  push:
    name: Docker Hub'ga yuklash
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vektorops-landing:${{ env.SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vektorops-landing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 2) Serverda ishga tushirish ----------
  deploy:
    name: Serverga deploy
    needs: push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: SSH sozlash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Serverda Docker Hub'dan tortib ishga tushirish
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vektorops-landing:${{ env.SHA }}
          # Server porti:konteyner porti (sayt konteynerda 8001'da ishlaydi).
          # Boshqa port kerak bo'lsa: Variables'da PORT_MAP (masalan 8001:8001)
          PORT_MAP: ${{ vars.PORT_MAP || '80:8001' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "IMAGE='$IMAGE' PORT_MAP='$PORT_MAP' bash -s" <<'REMOTE'
          set -e
          NAME=vektorops-landing

          docker pull "$IMAGE"
          docker rm -f "$NAME" 2>/dev/null || true
          docker run -d --name "$NAME" --restart unless-stopped -p "$PORT_MAP" "$IMAGE"

          # "healthy" bo'lishini kutamiz (eng ko'pi bilan 60 soniya)
          status=starting
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$NAME")
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "Konteyner sog'lom emas: $status"
            docker logs --tail 50 "$NAME"
            exit 1
          fi
          echo "Deploy muvaffaqiyatli: $IMAGE"
          docker image prune -f
          REMOTE